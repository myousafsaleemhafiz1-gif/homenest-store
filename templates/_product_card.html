<article class="product-card"><a href="{{ url_for('product_detail',slug=p.slug) }}" class="product-media"><img src="{{ p.image_url }}" alt="{{ p.title }}"><span class="product-badge">{{ p.badge or 'Featured' }}</span><button class="quick-add" type="button" data-add="{{ p.id }}" title="Add to bag"><i class="ri-add-line"></i></button></a><div class="product-info"><div class="product-meta"><span>{{ p.category|title }}</span><span><i class="ri-star-fill"></i> {{ p.rating }} ({{ p.review_count }})</span></div><a href="{{ url_for('product_detail',slug=p.slug) }}"><h3>{{ p.title }}</h3></a><p>{{ p.short_description }}</p><div class="price-row"><div><strong>{{ p.price|money }}</strong>{% if p.compare_price and p.compare_price > p.price %}<del>{{ p.compare_price|money }}</del>{% endif %}</div><div class="card-buy-actions"><button class="mini-add" data-add="{{ p.id }}">Add to cart</button><button class="mini-buy" data-buy="{{ p.id }}">Buy it</button></div></div></div></article>
