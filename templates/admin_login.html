{% extends 'base.html' %}{% block title %}Admin Login — HomeNest Store{% endblock %}{% block content %}<section class="auth-page"><div class="auth-card admin-auth"><div class="auth-brand-logo"><img src="{{ settings.logo_path if settings is defined else '/static/uploads/homenest-logo.png' }}" alt="HomeNest Store logo"></div><div class="eyebrow">Store admin</div><h1>Welcome to the control room.</h1><p>Manage products, stock and orders from one place.</p><form method="post"><input type="hidden" name="_csrf" value="{{ csrf_token }}"><label>Username<input name="username" required value="admin"></label><label>Password<input type="password" name="password" required></label><button class="btn dark full">Open dashboard</button></form><small class="admin-hint">Development default: admin / admin12345. Change it before deployment.</small></div></section>{% endblock %}
